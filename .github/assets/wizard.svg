#fff" opacity="0.58"/><circle cx="170.5" cy="87.2" r="0.80" fill="#fff" opacity="0.61"/><circle cx="556.1" cy="536.9" r="1.59" fill="#fff" opacity="0.29"/><circle cx="413.4" cy="351.2" r="0.50" fill="#fff" opacity="0.25"/><circle cx="413.5" cy="102.0" r="0.76" fill="#fff" opacity="0.76"/><circle cx="777.5" cy="853.3" r="0.98" fill="#fff" opacity="0.72"/><circle cx="962.4" cy="894.7" r="1.23" fill="#fff" opacity="0.56"/><circle cx="348.0" cy="454.6" r="1.05" fill="#fff" opacity="0.52"/><circle cx="567.4" cy="806.2" r="1.23" fill="#fff" opacity="0.60"/><circle cx="729.0" cy="988.0" r="1.43" fill="#fff" opacity="0.79"/><circle cx="438.1" cy="544.0" r="1.55" fill="#fff" opacity="0.79"/></g>

  <g filter="url(#shadow)">
    <rect x="44" y="44" width="912" height="1028.5" rx="14" fill="#0d1117"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="44" y="44" width="912" height="42" fill="url(#bar)"/>
    <line x1="44" y1="86" x2="956" y2="86" stroke="#262c38"/>
  </g>
  <rect x="44.5" y="44.5" width="911" height="1027.5" rx="14" fill="none" stroke="#2d3444"/>
  <circle cx="66" cy="65" r="6.5" fill="#ff5f57"/>
  <circle cx="88" cy="65" r="6.5" fill="#febc2e"/>
  <circle cx="110" cy="65" r="6.5" fill="#28c840"/>
  <text x="500" y="69.5" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500">vibe-now — ~/code/my-app</text>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#d6deeb">
    <text x="70" y="116"><tspan fill="#c4a7ff">❯</tspan> <tspan fill="#7aa2f7">~/code</tspan> <tspan fill="#e6edf3" font-weight="600">pnpm dlx vibe-now</tspan></text>
    <text x="70" y="159"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">What is your project name?</tspan> <tspan fill="#56d4dd">my-app</tspan></text>
    <text x="70" y="180.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Choose your framework:</tspan> <tspan fill="#56d4dd">Next.js (App Router, stable)</tspan></text>
    <text x="70" y="202"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Choose your package manager:</tspan> <tspan fill="#56d4dd">pnpm (11.17.0)</tspan></text>
    <text x="70" y="223.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Is this a Claude Code project? (generates CLAUDE.md instead of AGENTS.md)</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="245"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Development workflow (specs, ADRs, reviews, handoffs):</tspan> <tspan fill="#56d4dd">Phased, light (reviews on demand, speed to MVP)</tspan></text>
    <text x="70" y="266.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">State Management: Include Zustand?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="288"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Validation: Include Zod?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="309.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Effect System: Include Effect (effect-ts v4)?</tspan> <tspan fill="#7d8590">No</tspan></text>
    <text x="70" y="331"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Data Fetching: Include TanStack React Query?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="352.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">UI &amp; Components: Include shadcn/ui?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="374"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">UI &amp; Components: Include next-themes (Dark Mode)?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="395.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">UI &amp; Components: Include Motion (motion.dev, formerly Framer Motion)?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="417"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Authentication: Include Better Auth?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="438.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Database (Select One):</tspan> <tspan fill="#56d4dd">Postgres + Drizzle ORM (any host: local Docker, Neon, Railway, RDS, ...)</tspan></text>
    <text x="70" y="460"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">API Layer (Select One):</tspan> <tspan fill="#56d4dd">oRPC (type-safe RPC + OpenAPI spec &amp; docs)</tspan></text>
    <text x="70" y="481.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Agent Surface: Include MCP server (/api/mcp)?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="503"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Email: Include Resend?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="524.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Payments (Select One):</tspan> <tspan fill="#56d4dd">Stripe (Server + Client SDKs)</tspan></text>
    <text x="70" y="546"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">AI SDK: Include Vercel AI SDK?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="567.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">AI SDK: Include OpenRouter AI SDK Provider?</tspan> <tspan fill="#7d8590">No</tspan></text>
    <text x="70" y="589"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Background Jobs (Select One):</tspan> <tspan fill="#56d4dd">pg-boss (queue in your Postgres, separate worker process)</tspan></text>
    <text x="70" y="610.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">File Uploads (Select One):</tspan> <tspan fill="#56d4dd">Cloudflare R2 (S3 API, direct browser uploads)</tspan></text>
    <text x="70" y="632"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Analytics &amp; Monitoring: Include PostHog (product analytics)?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="653.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Analytics &amp; Monitoring: Include Sentry (error tracking)?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="675"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Linting &amp; Formatting:</tspan> <tspan fill="#56d4dd">ESLint + Prettier (Standard)</tspan></text>
    <text x="70" y="696.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">Testing (Select One):</tspan> <tspan fill="#56d4dd">Vitest + React Testing Library (Unit/Component)</tspan></text>
    <text x="70" y="718"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">UI Helpers: Include nuqs?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="739.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">UI Helpers: Include React Hook Form?</tspan> <tspan fill="#56d4dd">Yes</tspan></text>
    <text x="70" y="761"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">UI Helpers: Include Day.js?</tspan> <tspan fill="#7d8590">No</tspan></text>
    <text x="70" y="782.5"><tspan fill="#3fb950" font-weight="700">?</tspan> <tspan fill="#e6edf3" font-weight="600">UI Helpers: Include Lodash?</tspan> <tspan fill="#7d8590">No</tspan></text>
    <text x="70" y="825.5"><tspan fill="#3fb950">✔</tspan> <tspan fill="#d6deeb">Base Next.js app created!</tspan></text>
    <text x="70" y="847"><tspan fill="#3fb950">✔</tspan> <tspan fill="#d6deeb">Packages installed successfully!</tspan></text>
    <text x="70" y="868.5"><tspan>✨</tspan> <tspan fill="#d6deeb">Finalizing shadcn/ui...</tspan></text>
    <text x="70" y="890"><tspan fill="#3fb950">✔</tspan> <tspan fill="#d6deeb">Starter files generated (45 files)</tspan></text>
    <text x="70" y="911.5"><tspan fill="#3fb950">✔</tspan> <tspan fill="#d6deeb">Documentation, CLAUDE.md, .env.example generated!</tspan></text>
    <text x="70" y="933"><tspan fill="#3fb950">✔</tspan> <tspan fill="#d6deeb">Project weight: 1.3G (node_modules)</tspan></text>
    <text x="70" y="976"><tspan>🌌</tspan> <tspan fill="#e6edf3" font-weight="700">Vibe Check: COMPLETE. Your stack is ready.</tspan></text>
    <text x="70" y="997.5"><tspan>🚀</tspan> <tspan fill="#d6deeb">Next steps:</tspan></text>
    <text x="70" y="1019" fill="#56d4dd" xml:space="preserve">   cd my-app</text>
    <text x="70" y="1040.5" fill="#56d4dd" xml:space="preserve">   pnpm dev</text>
  </g>
</svg>
